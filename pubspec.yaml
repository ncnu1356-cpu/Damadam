name: damadam
description: "A social app called Damadam."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/

# ============================================================
# APP ICON
# ============================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/icon_fg.png"

# ============================================================
# SPLASH SCREEN
# ============================================================
flutter_native_splash:
  color: "#1E88E5"
  image: assets/splash.png
  android: true
  ios: false
  android_12:
    color: "#1E88E5"
    image: assets/splash.png
    icon_background_color: "#1E88E5"
