name: Build Damadam Flutter App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project if missing
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create . --project-name damadam --org com.damadam
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Commit Flutter project
        run: |
          git config user.name "Damadam Bot"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Create Damadam Flutter project"
          git push

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: damadam-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
